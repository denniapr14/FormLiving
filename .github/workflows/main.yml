name: Deploy Laravel 9 Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Laravel 9
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-ansi --no-scripts --no-progress --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate Laravel key
        run: php artisan key:generate

      - name: Generate storage link
        run: php artisan storage:link

      - name: Set permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Laravel Deploy
        uses: ngocquyhoang/laravel-deploy@laravel-custom-port
        with:
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          host: ${{ secrets.FTP_SERVER }}
          path: /public_html/webtest.formsliving.com/
          owner: denniapr14/FormLiving
